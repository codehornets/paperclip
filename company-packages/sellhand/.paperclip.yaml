      type: hermes_local
      config:
        provider: openai-codex
        model: gpt-5.6-sol
        timeoutSec: 900
        graceSec: 15
        maxTurnsPerRun: 30
        toolsets: "file,web"
        persistSession: true
        worktreeMode: false
        checkpoints: false
        quiet: true
    runtime:
      heartbeat:
        enabled: false
